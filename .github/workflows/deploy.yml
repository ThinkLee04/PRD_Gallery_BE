# Backend deploy — ships the CI-tested build to the Ubuntu VPS after be-ci is
# green on master. Native Node + systemd + Caddy topology (docs/technical-spec.md
# §14); no Docker.
#
# This is a SCAFFOLD: it runs once you provide the GitHub secrets/variables and
# prepare the server (both described below). No real credentials are hard-coded;
# the pipeline only triggers the deploy — secrets live in the server env file.
#
# Required GitHub secrets:
#   VPS_HOST      SSH hostname/IP of the server
#   VPS_USER      SSH user (root, or a user with passwordless `sudo -n`)
#   VPS_SSH_KEY   Private deploy key (OpenSSH format, no passphrase)
# Optional secrets / repository variables (defaults shown):
#   VPS_PORT                (default 22)
#   vars.VPS_APP_DIR        (default /opt/photo-vault)
#   vars.VPS_SERVICE_NAME   (default photo-vault)
#   vars.VPS_BACKUP_BEFORE_MIGRATE  'true'|'false' (default false; needs pg_dump)
#
# One-time VPS preparation (manual):
#   - env file   $APP_DIR/photo-vault.env  (chmod 600, owned by service user)
#       containing the full config from .env.example incl. DATABASE_URL,
#       GOOGLE_*, SESSION_SECRET, APP_BASE_URL, CORS_ORIGIN, R2_*
#   - systemd    $APP_DIR/current -> release dir
#       WorkingDirectory=$APP_DIR/current
#       EnvironmentFile=$APP_DIR/photo-vault.env
#       ExecStart=/usr/bin/node dist/server.js   (Node >= 20.19)
#       Restart=on-failure
#   - service named per vars.VPS_SERVICE_NAME; Caddy fronts it publicly.

name: be-deploy

on:
  workflow_run:
    workflows: ["be-ci"]
    branches: [master]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: be-deploy
  cancel-in-progress: false

env:
  APP_DIR: ${{ vars.VPS_APP_DIR || '/opt/photo-vault' }}
  SERVICE_NAME: ${{ vars.VPS_SERVICE_NAME || 'photo-vault' }}
  BACKUP_BEFORE_MIGRATE: ${{ vars.VPS_BACKUP_BEFORE_MIGRATE || 'false' }}
  SSH_USER: ${{ secrets.VPS_USER }}
  SSH_HOST: ${{ secrets.VPS_HOST }}
  SSH_PORT: ${{ secrets.VPS_PORT || '22' }}
  VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Validate VPS secrets are configured
        if: env.SSH_HOST == '' || env.SSH_USER == '' || env.VPS_SSH_KEY == ''
        run: |
          echo "::error::Missing required secrets. Add VPS_HOST, VPS_USER and VPS_SSH_KEY under Settings -> Secrets and variables -> Actions in the 'be' repository (as Secrets, not Variables), then re-run this workflow."
          exit 1

      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure SSH
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          # Normalize to LF: a key pasted with Windows CRLF line endings makes
          # ssh fail with "error in libcrypto" when loading the key.
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Fail fast with a clear message if the stored secret is still not a
          # readable private key.
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Upload release
        env:
          RELEASE_DIR: releases/${{ github.sha }}
        run: |
          set -euo pipefail
          # Ship only what a production runtime needs (dist + migrations + lockfile).
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" \
            -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            "mkdir -p '$APP_DIR/$RELEASE_DIR'"
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p '$SSH_PORT' -o StrictHostKeyChecking=yes" \
            ./dist ./migrations ./package.json ./package-lock.json \
            "$SSH_USER@$SSH_HOST:$APP_DIR/$RELEASE_DIR/"

      - name: Remote install, migrate, restart, health check
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" \
            -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            APP_DIR="$APP_DIR" RELEASE_DIR="releases/${{ github.sha }}" \
            SERVICE_NAME="$SERVICE_NAME" BACKUP_BEFORE_MIGRATE="$BACKUP_BEFORE_MIGRATE" \
            bash -s <<'REMOTE'
            set -euo pipefail
            RELEASE="$APP_DIR/$RELEASE_DIR"
            echo "==> release: $RELEASE"

            # 1. Production dependencies only (dev deps are never shipped).
            cd "$RELEASE"
            npm ci --omit=dev --no-audit --no-fund

            # 2. Point the live release at this build.
            ln -sfn "$RELEASE" "$APP_DIR/current"

            # 3. Optional pre-migration backup (DATABASE_URL read server-side).
            if [ "$BACKUP_BEFORE_MIGRATE" = "true" ]; then
              mkdir -p "$APP_DIR/backups"
              set -a
              . "$APP_DIR/photo-vault.env"
              set +a
              pg_dump "$DATABASE_URL" > "$APP_DIR/backups/pre-${RELEASE_DIR##*/}.sql" 2>/dev/null
            fi

            # 4. Apply migrations from the deployed build (spec §14 order).
            cd "$APP_DIR/current"
            set -a
            . "$APP_DIR/photo-vault.env"
            set +a
            node dist/db/migrate.js

            # 5. Restart the service (root, or passwordless sudo for the SSH user).
            if ! systemctl restart "$SERVICE_NAME" 2>/dev/null; then
              sudo -n systemctl restart "$SERVICE_NAME"
            fi

            # 6. Health check against the loopback-bound API (default port 3000).
            for i in $(seq 1 15); do
              if curl -fsS "http://127.0.0.1:3000/health" >/dev/null 2>&1; then
                echo "==> healthy after $i attempt(s)"
                exit 0
              fi
              sleep 2
            done
            echo "==> health check failed" >&2
            exit 1
            REMOTE
